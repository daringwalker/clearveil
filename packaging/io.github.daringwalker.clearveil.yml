app-id: io.github.daringwalker.clearveil
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: clearveil

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=host
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.freedesktop.portal.Desktop

modules:
  - name: libvips
    buildsystem: meson
    config-opts:
      - -Ddeprecated=false
      - -Dexamples=false
      - -Dcplusplus=false
      - -Ddocs=false
      - -Dintrospection=disabled
      - -Dvapi=false
      - -Dmodules=disabled
      - -Dcfitsio=disabled
      - -Dfftw=disabled
      - -Dheif=disabled
      - -Dimagequant=disabled
      - -Djpeg-xl=disabled
      - -Dmagick=disabled
      - -Dmatio=disabled
      - -Dnifti=disabled
      - -Dopenexr=disabled
      - -Dopenslide=disabled
      - -Dpdfium=disabled
      - -Dpoppler=disabled
      - -Draw=disabled
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /share
    sources:
      - type: archive
        url: https://github.com/libvips/libvips/releases/download/v8.18.0/vips-8.18.0.tar.xz
        sha256: 4ecdd6b3740859bccf0a70b452db7d70a6534767352b46ffee59483b5b8f5bec

  - name: exiv2
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DEXIV2_BUILD_SAMPLES=OFF
      - -DEXIV2_BUILD_EXIV2_COMMAND=OFF
      - -DEXIV2_BUILD_UNIT_TESTS=OFF
      - -DEXIV2_BUILD_DOC=OFF
    cleanup:
      - /bin
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - /share/man
    sources:
      - type: git
        url: https://github.com/Exiv2/exiv2.git
        tag: v0.28.8
        commit: 2cd987a731236037b6b78cbff897d08685a8ef49

  - name: clearveil
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: git
        url: https://github.com/daringwalker/clearveil.git
        tag: v0.2.0-beta.2
