name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cc: gcc
            cxx: g++
          - compiler: Clang
            cc: clang
            cxx: clang++
    steps:
      - name: Install build dependencies
        run: >-
          pacman -Syu --noconfirm
          git cmake ninja pkgconf
          qt6-base qt6-svg qt6-tools
          exiv2 libcolord libvips
          tesseract tesseract-data-eng tesseract-data-chi_sim
          ttf-dejavu
          appstream desktop-file-utils flatpak-builder
          ${{ matrix.compiler == 'Clang' && 'clang' || 'gcc' }}

      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Trust the container checkout
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Check repository hygiene
        run: |
          bash tools/check_repository_hygiene.sh
          bash tools/check_release_metadata.sh

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DCLEARVEIL_BUILD_BENCHMARKS=OFF
          -DCLEARVEIL_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Create and inspect source package
        run: |
          cpack --config build/CPackSourceConfig.cmake -G TGZ -B package
          bash tools/check_source_archive.sh package/clearveil-*-Source.tar.gz

  ubuntu:
    name: Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - name: Install build and OCR dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            ca-certificates git build-essential cmake ninja-build pkg-config \
            qt6-base-dev libqt6svg6-dev qt6-l10n-tools qt6-tools-dev-tools \
            libexiv2-dev libcolord-dev libvips-dev \
            libtesseract-dev tesseract-ocr \
            tesseract-ocr-eng tesseract-ocr-chi-sim \
            fonts-dejavu-core fonts-noto-cjk appstream desktop-file-utils

      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DCLEARVEIL_BUILD_BENCHMARKS=OFF
          -DCLEARVEIL_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify OCR models and recognition
        run: |
          tesseract --list-langs | grep -Fx eng
          tesseract --list-langs | grep -Fx chi_sim
          QT_QPA_PLATFORM=offscreen ./build/tests/clearveil_tests \
            ocrEngineRecognizesRenderedText \
            ocrEngineRecognizesInstalledChineseModel -v1 2>&1 \
            | tee /tmp/clearveil-ocr-test.log
          grep -F "PASS   : CoreTest::ocrEngineRecognizesRenderedText()" \
            /tmp/clearveil-ocr-test.log
          grep -F "PASS   : CoreTest::ocrEngineRecognizesInstalledChineseModel()" \
            /tmp/clearveil-ocr-test.log
