name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 17 * * 4"

permissions:
  contents: read
  security-events: write

defaults:
  run:
    shell: bash

jobs:
  analyze:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: >-
          pacman -Syu --noconfirm
          git cmake ninja pkgconf
          qt6-base qt6-svg qt6-tools
          exiv2 libcolord libvips
          tesseract tesseract-data-eng

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Trust the container checkout
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          languages: c-cpp
          build-mode: manual

      - name: Build
        run: |
          cmake -S . -B build-codeql -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTING=OFF \
            -DCLEARVEIL_BUILD_BENCHMARKS=OFF
          cmake --build build-codeql

      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
