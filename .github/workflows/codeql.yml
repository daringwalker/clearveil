name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 17 * * 4"

permissions:
  contents: read
  security-events: write

defaults:
  run:
    shell: bash

jobs:
  analyze:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: >-
          pacman -Syu --noconfirm
          cmake ninja pkgconf
          qt6-base qt6-svg qt6-tools
          exiv2 libcolord libvips
          tesseract tesseract-data-eng

      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2d92b76c45b91eb80fc44c74ce3fce0ee94e8f9d
        with:
          languages: c-cpp
          build-mode: manual

      - name: Build
        run: |
          cmake -S . -B build-codeql -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTING=OFF \
            -DCLEARVEIL_BUILD_BENCHMARKS=OFF
          cmake --build build-codeql

      - name: Analyze
        uses: github/codeql-action/analyze@717e230604b28efc38d8b4d3737d0611b16bc19a
